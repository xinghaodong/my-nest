name: Node.js CI CD

on:
    push:
        branches: ['nestmain']
    pull_request:
        branches: ['nestmain']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [18.19.1]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Clean and Install Dependencies
              run: |
                  rm -rf node_modules package-lock.json
                  npm cache clean --force
                  npm install --legacy-peer-deps

            - name: Build Project
              run: npm run build --if-present

            - name: List dist files (for debugging)
              run: ls -la ./dist/

            - name: Run Tests
              run: npm test

    deploy:
        runs-on: ubuntu-latest

        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            # 添加一个调试步骤
            - name: Debug SCP file paths
              run: echo "Source Path: ./dist/*"

            # 设置 SSH 密钥（从 GitHub secrets 中读取）
            - name: SSH Setup & Deploy
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: ./dist/*  # 确保 dist 目录下有文件
                  target: /var/www/html/

            # 在这里可以添加进一步的部署命令，例如重启服务器上的服务
            - name: Restart server (optional)
              run: ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }} "cd /var/www/html && docker-compose down && docker-compose up -d"
