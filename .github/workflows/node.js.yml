name: NestJS CI CD

on:
  push:
    branches: ['nestmain']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.19.1]

    steps:
      # 1️⃣ 拉代码（包含 src）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Node 环境
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3️⃣ 安装依赖（只在 CI）
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4️⃣ 构建 Nest（只在 CI）
      - name: Build project
        run: npm run build

      # 5️⃣ 只保留生产依赖
      - name: Prune dev dependencies
        run: npm prune --production

      # 6️⃣ 上传到服务器（覆盖 dist + node_modules）
      - name: Upload project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: |
            dist
            node_modules
            package.json
            package-lock.json
            src
          target: /var/www/home1/

      # 7️⃣ 服务器：生成 env + 重启进程
      - name: Restart app on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/home1

            echo "PORT=3000" > .env.production
            echo "DB_TYPE=mysql" >> .env.production
            echo "DB_HOST=127.0.0.1" >> .env.production
            echo "DB_PORT=3306" >> .env.production
            echo "DB_DATABASE=nestdatabase" >> .env.production
            echo "JWT_EXPIRES_IN=1h" >> .env.production
            echo "JWT_SECRET=secretKey" >> .env.production
            echo "REFRESH_SECRET=refSecretKey" >> .env.production
            echo "REFRESH_EXPIRES_IN=24h" >> .env.production
            echo "DEFAULT_PASSWORD=888888" >> .env.production
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env.production
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.production

            export NODE_OPTIONS="--max-old-space-size=512"

            pm2 start dist/main.js --name nest-app --env production || pm2 restart nest-app
