# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI CD

on:
    push:
        branches: ['nestmain']
    pull_request:
        branches: ['nestmain']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.8.1]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Clean and Install Dependencies
              run: |
                  rm -rf node_modules package-lock.json
                  npm cache clean --force
                  npm install --legacy-peer-deps

            - name: Build Project
              run: npm run build --if-present

            - name: Run Tests
              run: npm test
    deploy:
        runs-on: ubuntu-latest

        needs: build
        steps:
            # 检出代码
            - name: Checkout code
              uses: actions/checkout@v2
            # 设置 SSH 密钥（从 GitHub secrets 中读取）
            - name: SSH Setup & Deploy
              uses: webfactory/ssh-agent@v0.5.3
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
            # 部署到服务器
            - name: Deploy to Alibaba Cloud Server
              run: |
                  ssh -o StrictHostKeyChecking=no root@47.92.160.215 "cd /var/www/home1/ && git pull origin main && docker-compose down && docker-compose up -d"
