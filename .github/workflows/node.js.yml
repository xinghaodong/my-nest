name: Node.js CI CD

on:
    push:
        branches: ['nestmain']
    pull_request:
        branches: ['nestmain']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [18.19.1]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Clean and Install Dependencies
              run: |
                  rm -rf node_modules package-lock.json
                  npm cache clean --force
                  npm install --legacy-peer-deps

            - name: Build Project
              run: npm run build

            - name: Run Tests
              run: npm test

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # 上传源代码到服务器（排除 node_modules）
            - name: Upload source code to server1
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: './,**/*,!./node_modules/**'
                  target: /var/www/home1/ # 目标服务器路径

            # 在服务器上生成 .env.production 文件（只包含敏感信息）
            - name: Generate .env.production on server
              uses: appleboy/ssh-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd /var/www/home1
                      # 写入明文配置
                      echo "PORT=3000" > .env.production
                      echo "DB_TYPE=mysql" >> .env.production
                      echo "DB_HOST=127.0.0.1" >> .env.production
                      echo "DB_PORT=3306" >> .env.production
                      echo "DB_DATABASE=nestdatabase" >> .env.production
                      echo "JWT_EXPIRES_IN=1h" >> .env.production
                      echo "JWT_SECRET=secretKey" >> .env.production
                      echo "REFRESH_SECRET=refSecretKey" >> .env.production
                      echo "REFRESH_EXPIRES_IN=24h" >> .env.production
                      echo "DEFAULT_PASSWORD=888888" >> .env.production
                      # 写入敏感信息（通过 GitHub Secrets）
                      echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env.production
                      echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.production
                      echo "ALIYUN_API_KEY=${{ secrets.ALIYUN_API_KEY }}" >> .env.production

            # 在服务器上安装依赖并启动应用
            - name: Deploy to Alibaba Cloud Server (via SSH)
              uses: appleboy/ssh-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd /var/www/home1
                      npm install --legacy-peer-deps
                      npm run build
                      pm2 restart all || pm2 start npm --name "nest-app" -- run start:prod
