name: Node.js CI CD

on:
    push:
        branches: ['nestmain']
    pull_request:
        branches: ['nestmain']

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 22.20.0
              uses: actions/setup-node@v4
              with:
                  node-version: 22.20.0
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Build project
              run: npm run build

            # 👇 创建部署包（包含所有运行所需文件）
            - name: Prepare deployment package
              run: |
                  mkdir -p deploy-package
                  cp -r node_modules dist package.json nest-cli.json deploy-package/

            # 👇 打包成 tar.gz（避免 scp 路径问题）
            - name: Create tarball
              run: |
                  cd deploy-package
                  tar -czf ../deploy.tar.gz .
                  cd ..

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: nest-app-tar
                  path: deploy.tar.gz

    deploy:
        needs: build
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/nestmain' # 只在 push 到 nestmain 时部署（避免 PR 部署）
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: nest-app-tar

            - name: Upload tarball to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: 'deploy.tar.gz'
                  target: '/var/www/home1/'

            - name: Extract and deploy on server
              uses: appleboy/ssh-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd /var/www/home1

                      # 🔥 清理旧文件（只删关键文件，保留其他如 ai-com/ 等）
                      rm -rf dist node_modules package.json nest-cli.json 2>/dev/null || true

                      # 解压新版本
                      tar -xzf deploy.tar.gz

                      # 安全生成 .env.production（使用单引号 EOF 防止 shell 扩展）
                      cat > .env.production << 'EOF'
                      PORT=3000
                      DB_TYPE=mysql
                      DB_HOST=127.0.0.1
                      DB_PORT=3306
                      DB_DATABASE=nestdatabase
                      DB_USERNAME=${{ secrets.DB_USERNAME }}
                      DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                      JWT_SECRET=${{ secrets.JWT_SECRET }}
                      REFRESH_SECRET=${{ secrets.REFRESH_SECRET }}
                      ALIYUN_API_KEY=${{ secrets.ALIYUN_API_KEY }}
                      OLLAMA_HOST=100.102.217.36
                      DEFAULT_PASSWORD=888888
                      JWT_EXPIRES_IN=1h
                      REFRESH_EXPIRES_IN=24h
                      EOF

                      # 启动或重启应用
                      pm2 delete nest-app 2>/dev/null || true
                      pm2 start dist/main.js --name "nest-app" --cwd /var/www/home1
