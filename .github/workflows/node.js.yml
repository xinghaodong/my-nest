name: Node.js CI CD

on:
    push:
        branches: ['nestmain']
    pull_request:
        branches: ['nestmain']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [18.19.1]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Clean and Install Dependencies
              run: |
                  rm -rf node_modules package-lock.json
                  npm cache clean --force
                  npm install --legacy-peer-deps

            - name: Build Project
              run: npm run build --if-present

            - name: Run Tests
              run: npm test

            - name: Build Docker Image
              run: |
                  docker build -t my-nest-app:latest .  # 构建 Docker 镜像
                  docker save my-nest-app:latest -o ./my-nest-app.tar  # 保存镜像到当前目录
                  ls -lh  # 输出当前目录下的文件列表
                  pwd  # 打印当前工作目录

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            # 使用 SCP 上传 Docker 镜像文件到服务器
            - name: Upload Docker Image to Server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: ./my-nest-app.tar
                  target: /var/www/home1/

            # 通过 SSH 连接到服务器并执行 Docker 部署命令
            - name: Deploy to Alibaba Cloud Server (using docker-compose)
              uses: appleboy/ssh-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd /var/www/home1
                      docker load -i my-nest-app.tar  # 加载 Docker 镜像
                      docker-compose down  # 停止当前的容器
                      docker-compose up -d  # 启动新容器
