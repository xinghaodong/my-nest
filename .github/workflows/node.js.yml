name: Node.js CI CD

on:
    push:
        branches: ['nestmain']
    pull_request:
        branches: ['nestmain']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.8.1]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Clean and Install Dependencies
              run: |
                  rm -rf node_modules package-lock.json
                  npm cache clean --force
                  npm install --legacy-peer-deps

            - name: Build Project
              run: npm run build --if-present

            - name: Run Tests
              run: npm test

            - name: Build Docker Image
              run: |
                  docker build -t my-nest-app:latest .  # 构建 Docker 镜像
                  docker save my-nest-app:latest -o my-nest-app.tar  # 将镜像保存为 .tar 文件

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            # 设置 SSH 密钥（从 GitHub secrets 中读取）
            - name: SSH Setup & Deploy
              uses: webfactory/ssh-agent@v0.5.3
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            # 上传 Docker 镜像到服务器
            - name: Upload Docker Image to Server
              run: |
                  scp -i ${{ secrets.SSH_PRIVATE_KEY }} my-nest-app.tar root@47.92.160.215:/var/www/home1/

            # 部署到阿里云服务器
            - name: Deploy to Alibaba Cloud Server (using docker-compose)
              run: |
                  ssh -o StrictHostKeyChecking=no root@47.92.160.215 << 'EOF'
                  cd /var/www/home1
                  docker load -i my-nest-app.tar
                  docker-compose down
                  docker-compose up -d 
                  EOF
